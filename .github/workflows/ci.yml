name: O4O checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: o4o
          POSTGRES_USER: o4o
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U o4o" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://o4o:test-only-password@127.0.0.1:5432/o4o
      WEB_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npx tsx database/seed.ts
      - run: npm test
      - run: npm run build
      - run: |
          node apps/api/dist/main.js > /tmp/o4o-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:4000/api/v1/health && break || sleep 1; done
          npm run test:integration
          npx playwright install --with-deps chromium
          npm run test:browser
      - run: npm audit --audit-level=high
